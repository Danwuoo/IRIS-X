name: workstream-navigation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B tests/test_workstream_navigation.py
      - run: python -O -B tests/test_workstream_navigation.py
