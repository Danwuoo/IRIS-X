name: offline-validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-build-isolation -e .
      - run: python tools/repository_check.py --self-test
      - run: python tools/repository_check.py
      - run: python -m unittest discover -s tests -v
      - run: irisx fixture prepare --output .irisx/ci/fixture
      - run: irisx trial run --trial .irisx/ci/fixture/trial.json --output .irisx/ci/run
      - run: irisx package build --run .irisx/ci/run --output .irisx/ci/package
      - run: irisx package verify .irisx/ci/package
